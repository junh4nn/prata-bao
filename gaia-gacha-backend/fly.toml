app = "gaia-gacha-backend" # placeholder — update to match the name `fly launch` assigns
primary_region = "iad" # placeholder — set to your preferred fly.io region

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
