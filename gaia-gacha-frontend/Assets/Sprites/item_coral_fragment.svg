<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Coral Fragment — stamp style, branching tree structure -->

  <!-- Main trunk -->
  <path d="M64 110 L64 72" stroke="#2D6A4F" stroke-width="12" stroke-linecap="round"/>

  <!-- Left branch -->
  <path d="M64 88 Q44 80 32 60" stroke="#2D6A4F" stroke-width="10" stroke-linecap="round"/>

  <!-- Right branch -->
  <path d="M64 88 Q84 80 96 60" stroke="#2D6A4F" stroke-width="10" stroke-linecap="round"/>

  <!-- Far left branch -->
  <path d="M44 76 Q28 64 20 44" stroke="#2D6A4F" stroke-width="8" stroke-linecap="round"/>

  <!-- Far right branch -->
  <path d="M84 76 Q100 64 108 44" stroke="#2D6A4F" stroke-width="8" stroke-linecap="round"/>

  <!-- Outlines on top -->
  <path d="M64 110 L64 72" stroke="#95B8A0" stroke-width="12" stroke-linecap="round" opacity="0"/>

  <!-- Polyp tips -->
  <circle cx="64" cy="64" r="13" fill="#52B788" stroke="#95B8A0" stroke-width="3.5"/>
  <circle cx="32" cy="54" r="11" fill="#52B788" stroke="#95B8A0" stroke-width="3.5"/>
  <circle cx="96" cy="54" r="11" fill="#52B788" stroke="#95B8A0" stroke-width="3.5"/>
  <circle cx="20" cy="38" r="9" fill="#52B788" stroke="#95B8A0" stroke-width="3"/>
  <circle cx="108" cy="38" r="9" fill="#52B788" stroke="#95B8A0" stroke-width="3"/>

  <!-- Stroke on branches (on top of fill) -->
  <path d="M64 110 L64 72" stroke="#95B8A0" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M64 88 Q44 80 32 60" stroke="#95B8A0" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M64 88 Q84 80 96 60" stroke="#95B8A0" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M44 76 Q28 64 20 44" stroke="#95B8A0" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M84 76 Q100 64 108 44" stroke="#95B8A0" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Polyp detail dots -->
  <circle cx="62" cy="62" r="3.5" fill="#2D6A4F"/>
  <circle cx="30" cy="52" r="3" fill="#2D6A4F"/>
  <circle cx="94" cy="52" r="3" fill="#2D6A4F"/>
</svg>
